[project]
name = "webgui-tools"
version = "0.1.0"
description = "Web_GUI lab server and helpers: serve clips + labels, export corrected .slp, transcode"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "h5py",
    "sleap-io",
    "imageio-ffmpeg",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
